en:
  kurz_80: "German employment law for small firms: notice periods, costs, contracts."
  kurz_100: "German employment law for small companies: notice periods, costs, sick pay, contracts. No sign-in."
  kurz_160: "German employment law for small companies, like an HR department: notice periods, employer costs, sick pay, contracts, workflows, with calculation and source."
  kurz_200: "German employment law for small companies, answered like an HR department: notice periods, employer costs, sick pay, maternity leave, contract clauses and workflows, with calculation and source."
  lang: |
    Lintelly HR Deutschland gives Claude, ChatGPT and other assistants the German employment law facts a small company needs, without an HR department. Germany only: it covers German employment and social security law, nothing else.

    - Workflows with dates for a first hire, onboarding, leaving, sickness, pregnancy, parental leave, preparing a dismissal, end of probation, end of a fixed-term contract and monthly payroll.
    - Calculators for notice periods, the deadline for an unfair dismissal claim, probation, fixed-term contracts, maternity protection, parental leave, retention periods and break times.
    - Employer costs for full-time, part-time, working students and mini-jobs, minimum wage check, continued pay during sickness with the U1 refund, holiday entitlement and payout, severance rule of thumb.
    - Duties by company size: data protection officer, works council, whistleblower channel, special protection against dismissal, return-to-work management.
    - Letters and checklists: termination letter, warning letter, employment reference, job ad check against discrimination law, interview questions, employee talks, required contract terms.
    - 126 employment contract clauses with text, and a check of single clauses against 17 void clause types.
    - More than 200 statutory values with legal norm, official source and review date, and a calendar of upcoming changes.

    38 read-only tools, no account, nothing stored. Every answer has the result, the calculation, the source with review date and the note: general information, not legal advice for an individual case. Open source (MIT, content CC BY 4.0). Published by Lintelly (lintelly.com), external HR department for companies with 10 or more employees.
  beispiele:
    - "I'm hiring my first employee, 20 hours a week, starting December 1st. What do I need to do?"
    - "What does a mini-jobber cost me, and a part-timer with 1,800 euros gross?"
    - "An employee has been sick for three weeks. How long do I pay, and do I get anything back?"
    - "I want to dismiss someone. We are 6 people, he has been here for 2 years."
    - "What changes for employers on January 1st?"

de:
  kurz_80: "Deutsches Arbeitsrecht für kleine Firmen: Fristen, Kosten, Verträge, mit Quelle."
  kurz_100: "Deutsches Arbeitsrecht für kleine Firmen: Fristen, Kosten, Krankheit, Verträge. Ohne Anmeldung."
  kurz_160: "Deutsches Arbeitsrecht für kleine Firmen, wie eine Personalabteilung: Fristen, Kosten, Krankheit, Mutterschutz, Verträge, Abläufe, mit Rechenweg und Quelle."
  kurz_200: "Deutsches Arbeitsrecht für Gründer und kleine Firmen, wie eine Personalabteilung: Kündigungsfristen, Arbeitgeberkosten, Entgeltfortzahlung, Mutterschutz, Vertragsbausteine und Abläufe, mit Quelle."
  lang: |
    Lintelly HR Deutschland gibt Claude, ChatGPT und anderen Assistenten das Wissen einer Personalabteilung für kleine Firmen in Deutschland. Nur deutsches Arbeits- und Sozialversicherungsrecht.

    - Abläufe mit Daten: erste Einstellung, Eintritt, Austritt, Krankheit, Schwangerschaft, Elternzeit, Kündigung vorbereiten, Ende der Probezeit, Ende der Befristung, Monatsende Lohn.
    - Rechner für Kündigungsfrist, Klagefrist, Probezeit, Befristung, Mutterschutz, Elternzeit, Aufbewahrung und Pausen.
    - Kosten für Vollzeit, Teilzeit, Werkstudium und Minijob, Mindestlohn, Entgeltfortzahlung mit U1-Erstattung, Urlaub und Urlaubsabgeltung, Abfindung als Faustformel.
    - Pflichten je Firmengröße: Datenschutzbeauftragter, Betriebsrat, Meldestelle, Sonderkündigungsschutz, BEM.
    - Schreiben und Prüflisten: Kündigung, Abmahnung, Arbeitszeugnis, Stellenanzeige nach AGG, Interviewfragen, Mitarbeitergespräche, Pflichtangaben nach dem Nachweisgesetz.
    - 126 Vertragsbausteine mit Text und die Prüfung einzelner Klauseln gegen 17 unwirksame Klauseltypen.
    - Über 200 Rechtswerte mit Norm, amtlicher Fundstelle und Prüfdatum, dazu ein Kalender der kommenden Änderungen.

    38 Werkzeuge, nur lesend, ohne Konto, nichts wird gespeichert. Jede Antwort hat Ergebnis, Rechenweg, Quelle mit Prüfdatum und den Hinweis: allgemeine Auskunft, keine Rechtsberatung im Einzelfall. Offener Code (MIT, Inhalte CC BY 4.0). Herausgeber: Lintelly (lintelly.com), externe Personalabteilung für Firmen ab 10 Beschäftigten.
