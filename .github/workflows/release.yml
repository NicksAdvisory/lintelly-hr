# Release nach SemVer (Freigabe Nick 23.10.2026, _kanon/freigaben.md „Lintelly HR“): steht auf main eine neue Version in
# packages/mcp/package.json, laufen Tests und Bau, dann Tag und GitHub-Release (Datei für hr.lintelly.com), npm, ghcr.io und,
# wenn eingerichtet, das MCP Registry. hr.lintelly.com holt sich das Release selbst (ops/ausrollen.sh, alle 10 Minuten).
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: release, cancel-in-progress: false }
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      neu: ${{ steps.v.outputs.neu }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: v
        run: |
          v=$(node -p "require('./packages/mcp/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$v" >/dev/null 2>&1; then echo "neu=false" >> "$GITHUB_OUTPUT"; else echo "neu=true" >> "$GITHUB_OUTPUT"; fi
  release:
    needs: version
    if: needs.version.outputs.neu == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, registry-url: "https://registry.npmjs.org" }
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Rauchtest
        run: |
          node packages/mcp/dist/lintelly-hr-mcp-server.mjs --http --port 8787 &
          sleep 2
          node scripts/rauchtest.mjs http://127.0.0.1:8787/mcp
      - name: Tag und GitHub-Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cd packages/mcp/dist
          sha256sum lintelly-hr-mcp-server.mjs > lintelly-hr-mcp-server.mjs.sha256
          cd -
          awk "/^## $V/{f=1;next} /^## /{f=0} f" CHANGELOG.md > notizen.md
          gh release create "v$V" packages/mcp/dist/lintelly-hr-mcp-server.mjs packages/mcp/dist/lintelly-hr-mcp-server.mjs.sha256 \
            --title "Lintelly HR $V" --notes-file notizen.md --target "$GITHUB_SHA"
      - name: npm
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "::warning::NPM_TOKEN fehlt, npm übersprungen"; exit 0; fi
          cp LICENSE README.md packages/mcp/
          npm publish -w @lintelly/hr-mcp --access public --provenance
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/nicksadvisory/lintelly-hr:${{ env.V }},ghcr.io/nicksadvisory/lintelly-hr:latest
      - name: MCP Registry (nur bestehender Eintrag, die erste Einreichung macht Nick)
        if: vars.MCP_REGISTRY == 'true'
        env: { SCHLUESSEL: "${{ secrets.MCP_REGISTRY_KEY }}" }
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login dns --domain lintelly.com --private-key "$SCHLUESSEL"
          ./mcp-publisher publish
